    <script>
      // Suppress benign WebSocket / Vite dev server HMR disconnection notices
      (function () {
        var isBenign = function (msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1;
        };
        window.addEventListener('unhandledrejection', function (e) {
          if (isBenign(e && e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (e) {
          if (isBenign(e && e.message) || isBenign(e && e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var first = args[0] ? String(args[0]) : '';
          if (isBenign(first)) return;
          origConsoleError.apply(console, args);
        };
      })();
    </script>
