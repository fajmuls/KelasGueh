    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Kelas Gue" />
    <link rel="apple-touch-icon" href="/logo/Kelas_Gueh_Logo_Static.svg" />
    <link rel="icon" type="image/svg+xml" href="/logo/Kelas_Gueh_Logo_Static.svg" />
    <script>
      // Suppress benign WebSocket / Vite dev server HMR disconnection notices
      (function () {
        var isBenign = function (msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1;
        };
        window.addEventListener('unhandledrejection', function (e) {
          if (isBenign(e && e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (e) {
          if (isBenign(e && e.message) || isBenign(e && e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var first = args[0] ? String(args[0]) : '';
          if (isBenign(first)) return;
          origConsoleError.apply(console, args);
        };
      })();
    </script>
    <title>Kelas Gue</title>
    <meta name="description" content="Kelas Gue - Sistem transparansi kas kelas doodle art & paper cut-out terintegrasi Supabase." />

    <meta name="twitter:card" content="summary_large_image" />

  </body>
